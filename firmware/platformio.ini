[env:megaatmega2560_tc_scanner]
platform = platformio/atmelavr@5.3.0
board = megaatmega2560
framework = arduino
monitor_speed = 115200
build_src_filter = +<../examples/tc_scanner.cpp>
lib_deps = 
    adafruit/Adafruit MAX31855 library @ 1.4.2

[env:megaatmega2560_scanner]
platform = platformio/atmelavr@5.3.0
board = megaatmega2560
framework = arduino
monitor_speed = 115200
build_src_filter = +<../examples/soft_scanner.cpp>

[env:megaatmega2560_rtd_scanner]
platform = platformio/atmelavr@5.3.0
board = megaatmega2560
framework = arduino
monitor_speed = 115200
build_src_filter = +<../examples/rtd_scanner.cpp>

[env:megaatmega2560_main]
platform = platformio/atmelavr@5.3.0
board = megaatmega2560
framework = arduino
monitor_speed = 115200
upload_port = /dev/sensor_arduino
extra_scripts = pre:../scripts/load_firmware_env.py
build_src_filter = +<*> -<StepperController.cpp>
lib_deps = 
    adafruit/Adafruit MAX31855 library @ 1.4.2
    br3ttb/PID @ 1.2.1
    bblanchon/ArduinoJson @ 6.21.3
    bogde/HX711 @ 0.7.5



