<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reactor Controller</title>
    <script src="/vendor/tailwind.js"></script>
    <script src="/vendor/react.min.js"></script>
    <script src="/vendor/react-dom.min.js"></script>
    <script src="/vendor/prop-types.min.js"></script>
    <script src="/vendor/babel.min.js"></script>
    <script src="/vendor/chart.umd.js"></script>
    <script src="/vendor/luxon.min.js"></script>
    <script src="/vendor/chartjs-adapter-luxon.min.js"></script>
    <script src="/vendor/chartjs-plugin-streaming.min.js"></script>
</head>

<body class="bg-gray-900 text-white font-sans">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback } = React;

        const ERR_TC_GAS_INTERNAL = (1 << 0);
        const ERR_TC_FEEDSTOCK = (1 << 1);
        const ERR_TC_VAPORIZER_WALL = (1 << 2);
        const ERR_TC_REACTOR_INT_1 = (1 << 3);
        const ERR_TC_REACTOR_INT_2 = (1 << 4);
        const ERR_TC_REACTOR_EXT_1 = (1 << 5);
        const ERR_TC_REACTOR_EXT_2 = (1 << 6);
        const ERR_P_FEED = (1 << 7);
        const ERR_P_REACTOR = (1 << 8); // Not used yet
        const ERR_MFC_FLOW = (1 << 9);
        const ERR_H2_SENSOR = (1 << 10);

        const STATE_LABELS = {
            0: "STANDBY",
            1: "WARMUP",
            2: "WORKING",
            3: "ALARM",
            4: "FAULT"
        };

        const STATE_COLORS = {
            0: "text-gray-400 border border-gray-600",
            1: "text-yellow-400 border border-yellow-600",
            2: "text-green-400 border border-green-600",
            3: "text-orange-400 border border-orange-600",
            4: "text-red-400 border border-red-600"
        };

        class WebBuzzer {
            constructor() {
                this.audioCtx = null;
                this.isPlaying = false;
                this.interval = null;
                this.muted = false;
            }

            initCtx() {
                if (!this.audioCtx) {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    if (AudioCtx) {
                        this.audioCtx = new AudioCtx();
                    }
                }
                if (this.audioCtx && this.audioCtx.state === 'suspended') {
                    this.audioCtx.resume().catch(() => {});
                }
            }

            start() {
                if (this.muted) return;
                this.initCtx();
                if (this.isPlaying) return;
                this.isPlaying = true;

                let highTone = false;
                this.interval = setInterval(() => {
                    if (!this.isPlaying || this.muted) return;
                    this.initCtx();
                    if (!this.audioCtx) return;

                    try {
                        const now = this.audioCtx.currentTime;
                        const osc = this.audioCtx.createOscillator();
                        const gain = this.audioCtx.createGain();

                        // Sawtooth wave for crisp industrial alarm buzzer sound (800Hz / 1000Hz dual tone pulse)
                        osc.type = 'sawtooth';
                        osc.frequency.setValueAtTime(highTone ? 1000 : 800, now);
                        highTone = !highTone;

                        gain.gain.setValueAtTime(0.2, now);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);

                        osc.connect(gain);
                        gain.connect(this.audioCtx.destination);

                        osc.start(now);
                        osc.stop(now + 0.2);
                    } catch (e) {
                        console.error("WebBuzzer play error:", e);
                    }
                }, 220);
            }

            stop() {
                this.isPlaying = false;
                if (this.interval) {
                    clearInterval(this.interval);
                    this.interval = null;
                }
            }

            setMuted(muted) {
                this.muted = muted;
                if (muted) {
                    this.stop();
                }
            }
        }

        const webBuzzer = new WebBuzzer();
        window.addEventListener('click', () => webBuzzer.initCtx(), { once: false });
        window.addEventListener('keydown', () => webBuzzer.initCtx(), { once: false });

        function App() {
            const [data, setData] = useState([]);
            const [latest, setLatest] = useState(null);
            const [status, setStatus] = useState("DISCONNECTED");
            const [timeRange, setTimeRange] = useState(0.083);
            const [isRefreshing, setIsRefreshing] = useState(false);
            const [runStatus, setRunStatus] = useState(null);
            const [sessionReady, setSessionReady] = useState(false);
            const [showAlarmConfig, setShowAlarmConfig] = useState(false);
            const [showSystemSettings, setShowSystemSettings] = useState(false);
            const [alarmMinimized, setAlarmMinimized] = useState(false);
            const [alarmDismissed, setAlarmDismissed] = useState(false);
            const [audioMuted, setAudioMuted] = useState(false);
            const prevAlarmCodesRef = useRef("");
            const timeRangeRef = useRef(timeRange);

            useEffect(() => {
                timeRangeRef.current = timeRange;
            }, [timeRange]);

            useEffect(() => {
                fetch('/api/run/status')
                    .then(r => r.json())
                    .then(s => setRunStatus(s))
                    .catch(e => console.error(e));
            }, []);

            const fetchHistory = useCallback(async (targetTimeRange = timeRangeRef.current) => {
                if (!sessionReady) return;
                setIsRefreshing(true);
                try {
                    const res = await fetch(`/api/history?hours=${targetTimeRange}`);
                    const hist = await res.json();
                    setData(hist);
                } catch (e) {
                    console.error("Failed to fetch history", e);
                } finally {
                    setIsRefreshing(false);
                }
            }, [sessionReady]);

            useEffect(() => {
                if (!sessionReady) return;
                fetchHistory(timeRange);
            }, [timeRange, sessionReady, fetchHistory]);

            useEffect(() => {
                if (!sessionReady) return;
                const ws = new WebSocket(`ws://${window.location.host}/ws`);

                ws.onopen = () => setStatus("CONNECTED");
                ws.onclose = () => setStatus("DISCONNECTED");

                ws.onmessage = (event) => {
                    try {
                        const msg = JSON.parse(event.data);
                        
                        if (msg.event === "manual_override") {
                            console.warn("Physical manual override detected!");
                            return;
                        }
                        
                        msg.ts = new Date().toISOString();

                        setLatest(msg);
                        // Only append to data state when in 5-minute live mode
                        if (timeRangeRef.current === 0.083) {
                            setData(prev => {
                                const next = [...prev, msg];
                                if (next.length > 400) next.shift();
                                return next;
                            });
                        }
                    } catch (err) {
                        console.error("Failed to parse WebSocket telemetry packet", err);
                    }
                };

                return () => ws.close();
            }, [sessionReady]);

            const activeAlarmCodes = (latest?.alarms?.active || []).map(a => a.code).sort().join(",");
            const activeAlarmsList = latest?.alarms?.active || [];
            const isAlarmsSilenced = Boolean(latest?.alarms?.silenced);

            useEffect(() => {
                if (activeAlarmCodes && activeAlarmCodes !== prevAlarmCodesRef.current) {
                    setAlarmDismissed(false);
                    prevAlarmCodesRef.current = activeAlarmCodes;
                } else if (!activeAlarmCodes) {
                    prevAlarmCodesRef.current = "";
                    setAlarmDismissed(false);
                }
            }, [activeAlarmCodes]);

            useEffect(() => {
                webBuzzer.setMuted(audioMuted);
            }, [audioMuted]);

            useEffect(() => {
                const shouldBuzzerSound = activeAlarmsList.length > 0 && !isAlarmsSilenced;
                if (shouldBuzzerSound && !audioMuted) {
                    webBuzzer.start();
                } else {
                    webBuzzer.stop();
                }
                return () => webBuzzer.stop();
            }, [activeAlarmsList.length, isAlarmsSilenced, audioMuted]);

            const sendState = async (s) => {
                await fetch(`/api/control/state/${s}`, { method: 'POST' });
            }

            const sendSetpoint = async (zone, val, rate) => {
                await fetch(`/api/control/setpoint?zone=${zone}&value=${val}&rate=${rate || 0}`, { method: 'POST' });
            }

            if (!runStatus) return <div className="p-10 text-center text-gray-400">Loading Session State...</div>;
            
            if (!sessionReady) {
                return <RunManagerModal status={runStatus} onComplete={() => setSessionReady(true)} />;
            }

            const l = latest || {};
            const s = l.sensors || {};
            const h = l.heaters || {};
            const sp = l.sp || {};
            const stateIdx = l.state || 0;
            const errMask = s.status || 0;
            const alarms = l.alarms || { active: [], silenced: false, silence_time_left: 0.0 };
            const isConnected = status === "CONNECTED" && l.serial_connected !== false;

            return (
                <div className="min-h-screen p-4 flex flex-col gap-4">
                    {/* Header */}
                    <header className="bg-gray-800 p-4 rounded-lg shadow-lg flex justify-between items-center border-b border-gray-700">
                        <div className="flex items-center gap-3">
                            <h1 className="text-2xl font-bold tracking-tight text-blue-400">Reactor Controller</h1>
                            <span className={`px-2 py-0.5 rounded text-xs font-bold font-mono border ${isConnected ? 'bg-green-950 text-green-400 border-green-700' : 'bg-red-950 text-red-400 border-red-700 animate-pulse'}`}>
                                {isConnected ? "CONNECTED" : (latest ? "HARDWARE OFFLINE" : "CONNECTING...")}
                            </span>
                        </div>
                        <div className="flex gap-4 items-center">
                            {alarms.active && alarms.active.length > 0 && (
                                <button 
                                    onClick={() => { setAlarmDismissed(false); setAlarmMinimized(false); }}
                                    className={`px-3 py-1 rounded text-xs font-bold transition-all shadow flex items-center gap-1.5 animate-pulse ${alarms.silenced ? 'bg-yellow-900/80 border border-yellow-500 text-yellow-300 hover:bg-yellow-800' : 'bg-red-900/80 border border-red-500 text-red-200 hover:bg-red-800'}`}
                                    title="Click to show active alarm details"
                                >
                                    <span>{alarms.silenced ? '🔕' : '🚨'}</span>
                                    <span>{alarms.active.length} ALARM{alarms.active.length > 1 ? 'S' : ''} ACTIVE</span>
                                </button>
                            )}
                            <button 
                                onClick={() => setAudioMuted(!audioMuted)}
                                className={`px-2.5 py-1 rounded font-bold text-xs transition-all shadow border flex items-center gap-1.5 ${audioMuted ? 'bg-gray-800 text-gray-400 border-gray-700 hover:text-white' : 'bg-gray-700 text-green-400 border-green-600/50 hover:bg-gray-600'}`}
                                title={audioMuted ? "Enable Software Audio Alarm" : "Disable Software Audio Alarm"}
                            >
                                <span>{audioMuted ? '🔇' : '🔊'}</span>
                                <span>{audioMuted ? 'Muted' : 'Audio On'}</span>
                            </button>
                            <button 
                                onClick={() => setShowAlarmConfig(true)}
                                className="p-2 rounded bg-gray-700 hover:bg-gray-600 text-gray-200 text-lg transition-all shadow"
                                title="Alarm Settings"
                            >
                                ⚙
                            </button>
                            <button 
                                onClick={() => setShowSystemSettings(true)}
                                className="px-3 py-1.5 rounded bg-blue-700 hover:bg-blue-600 text-white font-bold text-xs transition-all shadow flex items-center gap-1.5"
                                title="Raspberry Pi Wi-Fi & System Settings"
                            >
                                <span>📶</span>
                                <span>Pi Settings</span>
                            </button>
                            <div className={`text-xl font-bold px-3 py-1 rounded bg-gray-900 ${STATE_COLORS[stateIdx]}`}>
                                {STATE_LABELS[stateIdx] || "UNKNOWN"}
                            </div>
                            <div className="text-sm text-gray-400 font-mono">uptime: {l.uptime ?? 0}s</div>
                        </div>
                    </header>

                    {/* Active Alarm Alert Banner */}
                    {l.alarms && l.alarms.active && l.alarms.active.length > 0 && (
                        <div className="bg-red-900/80 border border-red-500 text-red-200 px-4 py-3 rounded-lg shadow-lg mb-2">
                            <div className="font-bold flex items-center gap-2">
                                <span>⚠️ ACTIVE ALARM / WARNING:</span>
                            </div>
                            <ul className="list-disc list-inside text-sm mt-1 space-y-1">
                                {l.alarms.active.map((alm, idx) => (
                                    <li key={idx}><span className="font-semibold">{alm.name || alm.code}:</span> {alm.desc}</li>
                                ))}
                            </ul>
                        </div>
                    )}

                    {/* Alarm Settings Modal */}
                    {showAlarmConfig && <AlarmConfigModal onClose={() => setShowAlarmConfig(false)} />}

                    {/* System & Wi-Fi Settings Modal */}
                    {showSystemSettings && <SystemSettingsModal onClose={() => setShowSystemSettings(false)} />}

                    {/* Controls */}
                    <div className="flex gap-2 justify-center">
                        <button onClick={() => sendState(0)} className={`px-6 py-2 rounded font-bold transition-all ${stateIdx === 0 ? 'bg-gray-600 ring-2 ring-white' : 'bg-gray-700 text-gray-400 hover:bg-gray-600'}`}>STANDBY</button>
                        <button onClick={() => sendState(1)} className={`px-6 py-2 rounded font-bold transition-all ${stateIdx === 1 ? 'bg-yellow-600 ring-2 ring-white' : 'bg-yellow-800 text-yellow-200 hover:bg-yellow-700'}`}>WARMUP</button>
                        <button onClick={() => sendState(2)} className={`px-6 py-2 rounded font-bold transition-all ${stateIdx === 2 ? 'bg-green-600 ring-2 ring-white' : 'bg-green-800 text-green-200 hover:bg-green-700'}`}>WORKING</button>
                    </div>

                    {/* Process Cards */}
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                        {/* Feedstock Pump */}
                        <PumpCard pump={l.pump} />

                        {/* Load Cell */}
                        <LoadCellCard weight={s.weight} 
                            onTare={() => fetch('/api/control/tare', { method: 'POST' })}
                            onCalibrate={(w) => fetch(`/api/control/calibrate?value=${w}`, { method: 'POST' })} />

                        {/* H2 Sensor */}
                        <SensorCard title="H2 Sensor" value={s.h2} unit="ppm" color="text-pink-400" border="border-pink-500" />
                    </div>

                    {/* Temperature Controls */}
                    <h2 className="text-xl font-bold text-gray-300 mt-4 mb-1">Thermal Control</h2>
                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                        {/* Feedstock Reservoir */}
                        <SensorCard title="Feedstock Reservoir" value={s.t_feed_res} unit="°C" color="text-teal-400" border="border-teal-500"
                            errorMsg={parseExactError(errMask, 1<<0, s.tc_errors?.t_feed_res, false)} />

                        {/* Feedstock Preheater */}
                        <ZoneCard title="Feedstock Preheater"
                            temp={s.t_feed_pre} sp={sp.feed_pre} out={h.feed_pre}
                            onSetSp={(v, r) => sendSetpoint(0, v, r)}
                            errorMsg={parseExactError(errMask, 1<<1, s.tc_errors?.t_feed_pre, true)} />

                        {/* Liquid Reactor */}
                        <ZoneCard title="Liquid Reactor"
                            temp={s.t_liq_reac} sp={sp.liq_reac} out={h.liq_reac}
                            onSetSp={(v, r) => sendSetpoint(1, v, r)}
                            errorMsg={parseExactError(errMask, 1<<2, s.tc_errors?.t_liq_reac, true)} />

                        {/* Gas Reactor */}
                        <ZoneCard title="Gas Reactor"
                            temp={(s.t_gas_reac_int != null && !isNaN(s.t_gas_reac_int) && s.t_gas_reac_ext != null && !isNaN(s.t_gas_reac_ext))
                                ? (s.t_gas_reac_int * 0.7 + s.t_gas_reac_ext * 0.3)
                                : (s.t_gas_reac_ext != null && !isNaN(s.t_gas_reac_ext) ? s.t_gas_reac_ext : s.t_gas_reac_int)}
                            sub={`Int: ${s.t_gas_reac_int != null && !isNaN(s.t_gas_reac_int) ? Number(s.t_gas_reac_int).toFixed(1) + '°C' : 'ERR'} | Ext: ${s.t_gas_reac_ext != null && !isNaN(s.t_gas_reac_ext) ? Number(s.t_gas_reac_ext).toFixed(1) + '°C' : 'ERR'}`}
                            sp={sp.gas_reac} out={h.gas_reac}
                            onSetSp={(v, r) => sendSetpoint(2, v, r)}
                            errorMsg={parseExactError(errMask, (1<<3)|(1<<4), s.tc_errors?.t_gas_reac_int || s.tc_errors?.t_gas_reac_ext, true)} />
                    </div>

                    {/* Chart.js Real-time Streaming & Historical Chart */}
                    <TelemetryChart data={data} latest={latest} timeRange={timeRange} setTimeRange={setTimeRange} onRefresh={() => fetchHistory(timeRange)} isRefreshing={isRefreshing} />

                    {/* Floating Active Alarm Panel (Non-modal) */}
                    {alarms.active && alarms.active.length > 0 && !alarmDismissed && (
                        <div className="fixed bottom-4 right-4 z-40 max-w-md w-full px-2 pointer-events-auto">
                            <div className={`bg-gray-900/95 border-2 rounded-xl p-4 shadow-2xl flex flex-col gap-3 text-white transition-all backdrop-blur-md ${alarms.silenced ? 'border-yellow-500 shadow-yellow-900/40' : 'border-red-500 shadow-red-900/50'}`}>
                                <div className="flex items-center justify-between border-b border-gray-800 pb-2">
                                    <div className="flex items-center gap-2">
                                        <span className="text-2xl animate-bounce">{alarms.silenced ? '🔕' : '🚨'}</span>
                                        <div>
                                            <h2 className={`text-base font-bold uppercase tracking-wide ${alarms.silenced ? 'text-yellow-400' : 'text-red-500'}`}>
                                                {alarms.silenced ? `SILENCED (${alarms.silence_time_left}s left)` : `ALARM ACTIVE (${alarms.active.length})`}
                                            </h2>
                                            <p className="text-[11px] text-gray-400 font-mono">
                                                {alarms.silenced ? 'Buzzer Muted' : 'Buzzer Sounding'}
                                            </p>
                                        </div>
                                    </div>
                                    <div className="flex items-center gap-1">
                                        <button 
                                            onClick={() => setAlarmMinimized(!alarmMinimized)}
                                            className="p-1 px-2.5 rounded bg-gray-800 hover:bg-gray-700 text-gray-300 font-bold text-xs border border-gray-700 transition-all flex items-center gap-1"
                                            title={alarmMinimized ? "Expand Dialog" : "Minimize Dialog"}
                                        >
                                            {alarmMinimized ? '➕ Expand' : '➖ Minimize'}
                                        </button>
                                        <button 
                                            onClick={() => setAlarmDismissed(true)}
                                            className="p-1 px-2 rounded bg-gray-800 hover:bg-red-900/60 hover:border-red-500 text-gray-400 hover:text-red-200 font-bold text-xs border border-gray-700 transition-all"
                                            title="Hide Notification Window"
                                        >
                                            ✕
                                        </button>
                                    </div>
                                </div>

                                {!alarmMinimized ? (
                                    <>
                                        <div className="flex flex-col gap-2 max-h-[200px] overflow-y-auto pr-1">
                                            {alarms.active.map((alarm, idx) => (
                                                <div key={idx} className="bg-red-950/40 border border-red-900/60 p-2.5 rounded-lg flex flex-col gap-0.5 text-xs">
                                                    <div className="flex justify-between items-center">
                                                        <span className="font-bold text-red-400">{alarm.name}</span>
                                                        <span className="font-mono bg-red-900/60 text-red-200 px-1.5 py-0.5 rounded text-[10px] font-bold">{alarm.code}</span>
                                                    </div>
                                                    <p className="text-gray-300">{alarm.desc}</p>
                                                </div>
                                            ))}
                                        </div>

                                        <div className="flex gap-2 pt-1">
                                            <button 
                                                onClick={async () => {
                                                    if (!alarms.silenced) {
                                                        await fetch('/api/control/alarm/silence', { method: 'POST' });
                                                    }
                                                }} 
                                                disabled={alarms.silenced}
                                                className={`flex-1 py-2 font-bold text-sm rounded-lg shadow transition-all ${
                                                    alarms.silenced 
                                                        ? 'bg-gray-700 text-gray-400 opacity-50 cursor-not-allowed border border-gray-600' 
                                                        : 'bg-red-600 hover:bg-red-500 text-white active:scale-95'
                                                }`}
                                            >
                                                {alarms.silenced ? `Silenced (${alarms.silence_time_left}s)` : 'Silence Buzzer (5 Min)'}
                                            </button>
                                            <button
                                                onClick={() => sendState(0)}
                                                className="px-3 py-2 bg-gray-700 hover:bg-gray-600 text-gray-200 font-bold text-xs rounded-lg border border-gray-600 transition-all uppercase tracking-wide"
                                                title="Switch system to Standby"
                                            >
                                                Set Standby
                                            </button>
                                            <button
                                                onClick={() => setAlarmDismissed(true)}
                                                className="px-3 py-2 bg-gray-800 hover:bg-gray-700 text-gray-300 font-bold text-xs rounded-lg border border-gray-600 transition-all"
                                                title="Hide Window"
                                            >
                                                Hide
                                            </button>
                                        </div>
                                    </>
                                ) : (
                                    <div className="flex justify-between items-center text-xs pt-1">
                                        <span className="text-gray-300 font-medium truncate max-w-[200px]">
                                            {alarms.active.map(a => a.name).join(', ')}
                                        </span>
                                        <div className="flex items-center gap-1.5">
                                            {!alarms.silenced && (
                                                <button 
                                                    onClick={async () => {
                                                        await fetch('/api/control/alarm/silence', { method: 'POST' });
                                                    }}
                                                    className="bg-red-600 hover:bg-red-500 text-white font-bold px-2 py-1 rounded text-xs shadow"
                                                >
                                                    Silence
                                                </button>
                                            )}
                                            <button 
                                                onClick={() => setAlarmDismissed(true)}
                                                className="bg-gray-800 hover:bg-gray-700 text-gray-400 hover:text-white px-2 py-1 rounded text-xs border border-gray-700"
                                                title="Hide Window"
                                            >
                                                Hide
                                            </button>
                                        </div>
                                    </div>
                                )}
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        function TelemetryChart({ data, latest, timeRange, setTimeRange, onRefresh, isRefreshing }) {
            const canvasRef = useRef(null);
            const chartInstanceRef = useRef(null);
            const latestRef = useRef(latest);
            const isLive = timeRange === 0.083;
            const isLiveRef = useRef(isLive);
            const timeRangeRef = useRef(timeRange);

            useEffect(() => {
                latestRef.current = latest;
            }, [latest]);

            useEffect(() => {
                isLiveRef.current = isLive;
                timeRangeRef.current = timeRange;
            }, [isLive, timeRange]);

            const parseTs = (tVal) => {
                if (!tVal) return Date.now();
                if (typeof tVal === 'number') return tVal;
                let s = String(tVal).trim();
                s = s.replace(' ', 'T');
                if (!s.endsWith('Z') && !s.includes('+') && !s.includes('-', 10)) {
                    s += 'Z';
                }
                const parsed = new Date(s).getTime();
                return isNaN(parsed) ? Date.now() : parsed;
            };

            const formatDatasetData = useCallback((dataList) => {
                const weightPts = [];
                const speedPts = [];
                const feedResPts = [];
                const feedPrePts = [];
                const liqReacPts = [];
                const gasIntPts = [];
                const gasExtPts = [];

                if (Array.isArray(dataList)) {
                    dataList.forEach(item => {
                        const s = item.sensors || {};
                        const p = item.pump || {};
                        const tVal = parseTs(item.ts);

                        if (s.weight != null) weightPts.push({ x: tVal, y: s.weight });
                        if (p.speed != null) speedPts.push({ x: tVal, y: p.speed });
                        if (s.t_feed_res != null) feedResPts.push({ x: tVal, y: s.t_feed_res });
                        if (s.t_feed_pre != null) feedPrePts.push({ x: tVal, y: s.t_feed_pre });
                        if (s.t_liq_reac != null) liqReacPts.push({ x: tVal, y: s.t_liq_reac });
                        if (s.t_gas_reac_int != null) gasIntPts.push({ x: tVal, y: s.t_gas_reac_int });
                        if (s.t_gas_reac_ext != null) gasExtPts.push({ x: tVal, y: s.t_gas_reac_ext });
                    });
                }
                return { weightPts, speedPts, feedResPts, feedPrePts, liqReacPts, gasIntPts, gasExtPts };

                        yAxisID: 'yWeight',
                        borderColor: '#14B8A6',

                        borderWidth: 2,
                        pointRadius: 0,
                        pointHoverRadius: 4,

                    {
                        label: 'Pump Speed',
                        yAxisID: 'yTemp',
                        borderColor: '#818CF8',

                        borderWidth: 2,
                        pointRadius: 0,
                        pointHoverRadius: 4,
                        data: initialData.liqReacPts
                    },
                    {
                        label: 'Gas Int (°C)',
                        yAxisID: 'yTemp',
                        borderColor: '#A78BFA',
                        backgroundColor: '#A78BFA',
                        borderWidth: 2,
                        pointRadius: 0,
                        pointHoverRadius: 4,
                        data: initialData.gasIntPts
                    },
                    {
                        label: 'Gas Ext (°C)',
                        yAxisID: 'yTemp',
                        borderColor: '#6366F1',
                        backgroundColor: '#6366F1',
                        borderWidth: 2,
                        pointRadius: 0,
                        pointHoverRadius: 4,
                        data: initialData.gasExtPts
                    }
                ];

                const xScaleConfig = isLive ? {
                    type: 'realtime',
                    realtime: {
                        duration: timeRange * 3600 * 1000,
                        refresh: 1000,
                        delay: 1000,
                        pause: false,
                        onRefresh: (chart) => {
                            if (!isLiveRef.current) return;
                            const l = latestRef.current;
                            if (!l) return;
                            const now = Date.now();
                            const s = l.sensors || {};
                            const p = l.pump || {};

                            chart.data.datasets[0].data.push({ x: now, y: s.weight ?? null });
                            chart.data.datasets[1].data.push({ x: now, y: p.speed ?? null });
                            chart.data.datasets[2].data.push({ x: now, y: s.t_feed_res ?? null });
                            chart.data.datasets[3].data.push({ x: now, y: s.t_feed_pre ?? null });
                            chart.data.datasets[4].data.push({ x: now, y: s.t_liq_reac ?? null });
                            chart.data.datasets[5].data.push({ x: now, y: s.t_gas_reac_int ?? null });
                            chart.data.datasets[6].data.push({ x: now, y: s.t_gas_reac_ext ?? null });
                        }
                    },
                    ticks: { color: '#9CA3AF' },
                    grid: { color: '#374151' }
                } : {
                    type: 'time',
                    time: {
                        displayFormats: {
                            minute: 'HH:mm',
                            hour: 'HH:mm',
                            day: 'MMM d HH:mm'
                        },
                        tooltipFormat: 'yyyy-MM-dd HH:mm:ss'
                    },
                    min: Date.now() - timeRange * 3600 * 1000,
                    max: Date.now(),
                    ticks: { color: '#9CA3AF' },
                    grid: { color: '#374151' }
                };

                const config = {
                    type: 'line',
                    data: { datasets },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        animation: false,
                        interaction: {
                            intersect: false,
                            mode: 'nearest'
                        },
                        plugins: {
                            legend: {
                                labels: {
                                    color: '#9CA3AF',
                                    font: { size: 12 }
                                }
                            },
                            tooltip: {
                                backgroundColor: '#1F2937',
                                titleColor: '#F3F4F6',
                                bodyColor: '#F3F4F6',
                                borderColor: '#4B5563',
                                borderWidth: 1
                            }
                        },
                        scales: {
                            x: xScaleConfig,
                            yWeight: {
                                type: 'linear',
                                display: true,
                                position: 'left',
                                title: { display: true, text: 'Weight (Kg)', color: '#14B8A6' },
                                ticks: { color: '#9CA3AF' },
                                grid: { color: '#374151' }
                            },
                            yTemp: {
                                type: 'linear',
                                display: true,
                                position: 'right',
                                title: { display: true, text: 'Temp (°C) / RPM', color: '#818CF8' },
                                ticks: { color: '#9CA3AF' },
                                grid: { drawOnChartArea: false }
                            }
                        }
                    }
                };

                if (chartInstanceRef.current) {
                    chartInstanceRef.current.destroy();
                }
                const chartInstance = new Chart(ctx, config);
                chartInstanceRef.current = chartInstance;

                return () => {
                    chartInstance.destroy();
                    chartInstanceRef.current = null;
                };
            }, [isLive]);

            // Update chart data when data or timeRange changes (especially in historical mode)
            useEffect(() => {
                const chart = chartInstanceRef.current;
                if (!chart) return;

                if (!isLive) {
                    chart.options.scales.x.min = Date.now() - timeRange * 3600 * 1000;
                    chart.options.scales.x.max = Date.now();
                }

                const formatted = formatDatasetData(data);
                chart.data.datasets[0].data = formatted.weightPts;
                chart.data.datasets[1].data = formatted.speedPts;
                chart.data.datasets[2].data = formatted.feedResPts;
                chart.data.datasets[3].data = formatted.feedPrePts;
                chart.data.datasets[4].data = formatted.liqReacPts;
                chart.data.datasets[5].data = formatted.gasIntPts;
                chart.data.datasets[6].data = formatted.gasExtPts;

                chart.update('quiet');
            }, [data, timeRange, isLive, formatDatasetData]);

            return (
                <div className="flex-1 bg-gray-800 p-4 rounded-lg min-h-[400px] border border-gray-700 shadow-inner flex flex-col">
                    <div className="flex flex-wrap justify-between items-center mb-4 gap-2">
                        <div className="flex items-center gap-2">
                            <h2 className="text-lg font-bold text-gray-300">Telemetry Chart</h2>
                            <span className={`px-2 py-0.5 text-xs font-semibold rounded border ${
                                isLive 
                                    ? 'bg-emerald-950/80 text-emerald-400 border-emerald-700' 
                                    : 'bg-blue-950/80 text-blue-400 border-blue-700'
                            }`}>
                                {isLive ? '🔴 LIVE STREAMING' : '📜 HISTORICAL (STATIC)'}
                            </span>
                        </div>
                        <div className="flex items-center gap-2">
                            <select className="bg-gray-700 text-white border border-gray-600 rounded px-2.5 py-1 text-sm outline-none cursor-pointer hover:bg-gray-650"
                                value={timeRange} onChange={(e) => setTimeRange(parseFloat(e.target.value))}>
                                <option value={0.083}>Last 5 Minutes (Live)</option>
                                <option value={0.5}>Last 30 Minutes</option>
                                <option value={1}>Last 1 Hour</option>
                                <option value={6}>Last 6 Hours</option>
                                <option value={24}>Last 24 Hours</option>
                                <option value={72}>Last 72 Hours</option>
                            </select>
                            <button
                                onClick={() => onRefresh && onRefresh()}

                                className="flex items-center gap-1.5 bg-gray-700 hover:bg-gray-600 active:bg-gray-500 text-gray-200 border border-gray-600 px-3 py-1 rounded text-sm font-medium transition-all disabled:opacity-50 cursor-pointer shadow-sm"
                                title="Query database for updated data"
                            >
                                <span className={`inline-block text-xs ${isRefreshing ? 'animate-spin' : ''}`}>🔄</span>
                                <span>Refresh</span>
                            </button>
                        </div>
                    </div>
                    <div className="relative flex-1 min-h-[350px]">
                        <canvas ref={canvasRef}></canvas>
                    </div>
                </div>
            );
        }

            const [networks, setNetworks] = useState([]);

            const [password, setPassword] = useState("");
            const [showPassword, setShowPassword] = useState(false);
            const [connecting, setConnecting] = useState(false);
            const [actionMsg, setActionMsg] = useState("");
            const [actionErr, setActionErr] = useState("");

            const fetchStatus = async () => {
                setLoadingStatus(true);
                try {
                    const res = await fetch('/api/system/status');
                    const data = await res.json();
                    setStatus(data);
                } catch (e) {
                    console.error("Failed to fetch system status", e);
                } finally {
                    setLoadingStatus(false);
                }
            };

            const handleScan = async () => {
                setScanning(true);
                setActionMsg("");
                setActionErr("");
                try {
                    const res = await fetch('/api/wifi/scan');
                    const data = await res.json();
                    setNetworks(Array.isArray(data) ? data : []);
                } catch (e) {
                    setActionErr("Failed to scan Wi-Fi networks");
                } finally {
                    setScanning(false);
                }
            };

                if (e) e.preventDefault();
                if (!ssid.trim()) {
                    setActionErr("Please select or enter a Wi-Fi network (SSID)");
                    return;
                }
                setConnecting(true);
                setActionMsg(`Connecting to "${ssid}"... (This may take up to 25 seconds)`);
                setActionErr("");
                try {
                    const res = await fetch('/api/wifi/connect', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ ssid: ssid.trim(), password })
                    });
                    const data = await res.json();
                    if (data.status === "ok") {
                        setActionMsg(`Successfully connected to "${ssid}"!`);
                        setTimeout(() => fetchStatus(), 2000);
                    } else {
                        setActionErr(data.message || "Failed to connect to network.");
                        if (data.restored_hotspot) {
                            setActionMsg("Hotspot 'Reactor-Rig' safely restored.");

                    }
                } catch (err) {
                    setActionErr("Request failed: " + err);
                } finally {
                    setConnecting(false);

                    const data = await res.json();

                        setActionMsg("Hotspot 'Reactor-Rig' is now active!");
                        setTimeout(() => fetchStatus(), 1500);

        function parseExactError(statusMask, bitMask, errCode, isRtd = false) {
            if (!statusMask || !(statusMask & bitMask)) return null;
            if (!errCode || errCode === 0) return "PERSISTENT FAULT";
            let parts = [];
            if (isRtd) {
                if (errCode & 0x04) parts.push("Voltage OOR (0x04)");
                if (errCode & 0x08) parts.push("RTDIn-/Force- Open (0x08)");
                if (errCode & 0x10) parts.push("RefIn- Low/Open (0x10)");
                if (errCode & 0x20) parts.push("RefIn- High (0x20)");
                if (errCode & 0x40) parts.push("Low Temp Threshold (0x40)");
                if (errCode & 0x80) parts.push("High Temp Threshold (0x80)");
            } else {
                if (errCode & 0x01) parts.push("Open Circuit (0x01)");
                if (errCode & 0x02) parts.push("Short to GND (0x02)");
                if (errCode & 0x04) parts.push("Short to VCC (0x04)");
                if (errCode & 0x08) parts.push("Comm Fault / NaN (0x08)");
            }
            return parts.length > 0 ? parts.join(", ") : `Fault 0x${errCode.toString(16)}`;
        }

                        <div className="flex flex-col gap-2">
                            <div className="flex justify-between items-center">
                                <label className="text-sm text-gray-400">Dir</label>
                                <select className="bg-gray-900 border border-gray-600 rounded px-2 py-1 text-white text-sm"
                                    value={localDir} onChange={(e) => setLocalDir(parseInt(e.target.value))}>
                                    <option value={0}>CW</option>
                                    <option value={1}>CCW</option>
                                </select>
                            </div>
                            <div className="flex justify-between items-center">
                                <label className="text-sm text-gray-400">Speed</label>
                                <input type="number" min="0" max="350" className="bg-gray-900 border border-gray-600 rounded px-2 py-1 text-white text-sm w-20"
                                    value={localSpeed} onChange={(e) => setLocalSpeed(e.target.value)} />
                            </div>
                            <div className="flex gap-2 mt-2">
                                <button className="flex-1 bg-green-600 hover:bg-green-500 py-1 rounded text-sm font-bold" 
                                    onClick={() => fetch(`/api/control/pump/manual?state=run&dir=${localDir}&speed=${localSpeed}`, { method: 'POST' })}>START</button>
                                <button className="flex-1 bg-red-600 hover:bg-red-500 py-1 rounded text-sm font-bold" 
                                    onClick={() => fetch(`/api/control/pump/manual?state=stop&dir=${localDir}&speed=${localSpeed}`, { method: 'POST' })}>STOP</button>
                            </div>
                        </div>
                    ) : (
                        <div className="flex flex-col gap-2">
                            <div className="flex justify-between items-center">
                                <label className="text-sm text-gray-400">Min (Kg)</label>
                                <input type="number" step="0.1" className="bg-gray-900 border border-gray-600 rounded px-2 py-1 text-white text-sm w-20"
                                    value={localMin} onChange={(e) => setLocalMin(e.target.value)} />
                            </div>
                            <div className="flex justify-between items-center">
                                <label className="text-sm text-gray-400">Max (Kg)</label>
                                <input type="number" step="0.1" className="bg-gray-900 border border-gray-600 rounded px-2 py-1 text-white text-sm w-20"
                                    value={localMax} onChange={(e) => setLocalMax(e.target.value)} />
                            </div>
                            <div className="flex justify-between items-center">
                                <label className="text-sm text-gray-400">Rec. RPM</label>
                                <input type="number" min="0" max="350" className="bg-gray-900 border border-gray-600 rounded px-2 py-1 text-white text-sm w-20"
                                    value={localSpeed} onChange={(e) => setLocalSpeed(e.target.value)} />
                            </div>
                            <div className="flex justify-between items-center">
                                <label className="text-sm text-gray-400">Dir</label>
                                <select className="bg-gray-900 border border-gray-600 rounded px-2 py-1 text-white text-sm w-20"
                                    value={localDir} onChange={(e) => setLocalDir(parseInt(e.target.value))}>
                                    <option value={0}>CW</option>
                                    <option value={1}>CCW</option>
                                </select>
                            </div>
                            <button className="w-full mt-2 bg-indigo-600 hover:bg-indigo-500 py-1 rounded text-sm font-bold" 
                                onClick={() => fetch(`/api/control/pump/auto?min_w=${localMin}&max_w=${localMax}&rec_rpm=${localSpeed}&dir=${localDir}`, { method: 'POST' })}>APPLY AUTO</button>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
